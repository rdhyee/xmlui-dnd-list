<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xmlui-dnd-list — XMLUI demo</title>
  </head>
  <body>
    <!-- 1. XMLUI standalone runtime: brings window.xmlui, window.React, window.ReactDOM. -->
    <script src="./vendor/xmlui-standalone.umd.js"></script>

    <!--
      2. JSX-runtime shim. The xmlui-standalone bundle exposes React but
      not react/jsx-runtime, while the extension UMD (built via xmlui
      build-lib) externalizes react/jsx-runtime and looks for it as
      window.react_jsx_runtime. Bridge that gap with React.createElement.
    -->
    <script>
      (function () {
        var R = window.React;
        if (!R || window.react_jsx_runtime) return;
        function jsx(type, props, key) {
          var p = props || {};
          var children = p.children;
          var rest = {};
          for (var k in p) if (k !== "children") rest[k] = p[k];
          if (key !== undefined) rest.key = key;
          if (children === undefined) return R.createElement(type, rest);
          return R.createElement.apply(
            R,
            [type, rest].concat(Array.isArray(children) ? children : [children]),
          );
        }
        window.react_jsx_runtime = { jsx: jsx, jsxs: jsx, Fragment: R.Fragment };
      })();
    </script>

    <!-- 3. The extension UMD auto-registers DndItems with xmlui at script-load time. -->
    <script src="./vendor/xmlui-dnd-list.js"></script>
  </body>
</html>
